# Mergify の設定（PoC SF1 で試す）。
# - 人が PR に `merge` のラベルを付けると、条件を満たしていればキューに入る。
#   （ラベルでキューに入れる規則 pull_request_rules は、Mergify の Workflow Automation を有効にすると動く）
# - キューは 1 件ずつ、PR のブランチに main を取り込んで CI を回し直してから、squash でマージする。
# - マージを人が判断する決まりは変えない（`merge` のラベルを付けるのは人だけ）。
#   ただし PoC では AI も同じアカウントで動くため、AI がラベルを付けることは手順書でしか止められない。
#   配る標準では、AI を専用の ID で動かし、人の承認をマージの条件に入れる。
queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - label = merge
      - -draft
      - check-success = app-check
      - check-success = pr-body-check
    # キューの中では一時的な draft の PR で CI を回すので、PR 本文の検査（draft では動かない）は
    # キューに入る条件（queue_conditions）だけで確かめ、マージの条件には入れない。
    merge_conditions:
      - check-success = app-check

pull_request_rules:
  - name: merge のラベルが付いた PR をキューに入れる
    conditions:
      - label = merge
      - -draft
    actions:
      queue:
        name: default
