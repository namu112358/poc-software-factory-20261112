# Mergify の設定（PoC SF1 で試す）。
# - レビューの Routine が ok を出した PR は、自動でキューに入る（2026-11-13 のユーザーの決定）。ok は、GitHub Actions
#   （.github/workflows/factory-review-status.yml）が PR の最新のコミットに付ける status（factory-review）で表す。
#   ただし risk:high の PR（DB のスキーマ・ログイン・権限など）と、品質のゲート（この設定・.github/・.claude/・scripts/factory/・AGENTS.md・
#   CLAUDE.md・docs/rulesets/・package.json など。一覧は scripts/factory/claim-core.ts の GATE_PATHS）を変える PR には factory-review を付けないので、人が `merge:requested` のラベルを付けたときだけ入る。
# - 人が PR に `merge:requested` のラベルを付けたときも、条件を満たしていればキューに入る（pull_request_rules。Workflow Automation が必要）。
# - キューは「その場」方式: 1 件ずつ、PR のブランチに main を取り込んで、PR そのものの上で CI を回し直してから
#   squash でマージする。一時的な draft の PR は作らない（PR 本文の検査が元の PR の上で走り、Ruleset の strict も残せる）。
#   その場方式の条件: max_parallel_checks が 1、batch_size が 1、merge_conditions を書かない（queue_conditions と同じ扱い）。
# - `merge:requested` のラベルを付けるのは人だけ。
#   ただし PoC では AI も同じアカウントで動くため、AI がラベルを付けることは手順書でしか止められない。
#   配る標準では、AI を専用の ID で動かし、人の承認をキューに入る条件に入れる。
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - -draft
      - check-success = app-check
      - check-success = pr-body-check
      - or:
          - label = merge:requested
          - and:
              - -label = risk:high
              - status-success = factory-review

pull_request_rules:
  - name: レビューを通った PR（risk:high 以外）と、merge:requested のラベルが付いた PR をキューに入れる
    conditions:
      - -draft
      - or:
          - label = merge:requested
          - and:
              - -label = risk:high
              - status-success = factory-review
    actions:
      queue:
        name: default
