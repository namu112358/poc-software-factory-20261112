# Mergify の設定（PoC SF1 で試す）。
# - 人が PR に `merge` のラベルを付けると、条件を満たしていれば自動でキューに入る（autoqueue）。
# - キューは 1 件ずつ、PR のブランチに main を取り込んで CI を回し直してから、squash でマージする。
# - マージを人が判断する決まりは変えない（`merge` のラベルを付けるのは人だけ）。
queue_rules:
  - name: default
    autoqueue: true
    merge_method: squash
    queue_conditions:
      - label = merge
      - -draft
      - check-success = app-check
      - check-success = pr-body-check
    merge_conditions:
      - check-success = app-check
      - check-success = pr-body-check
