# Mergify の設定（PoC SF1 で試す）。
# - 人が PR に `@Mergifyio queue` とコメントすると、条件を満たしていればキューに入る。
#   （ラベルで自動でキューに入れる規則は、Mergify の Workflow Automation を有効にしないと動かないため使わない）
# - キューは 1 件ずつ、PR のブランチに main を取り込んで CI を回し直してから、squash でマージする。
# - マージを人が判断する決まりは変えない（キューに入れるコメントを書くのは人だけ）。
queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - -draft
      - check-success = app-check
      - check-success = pr-body-check
    merge_conditions:
      - check-success = app-check
      - check-success = pr-body-check
