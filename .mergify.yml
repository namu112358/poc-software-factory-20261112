# Mergify の設定（PoC SF1 で試す）。
# - 人が PR に `merge:requested` のラベルを付けると、条件を満たしていればキューに入る（pull_request_rules。Workflow Automation が必要）。
# - キューは「その場」方式: 1 件ずつ、PR のブランチに main を取り込んで、PR そのものの上で CI を回し直してから
#   squash でマージする。一時的な draft の PR は作らない（PR 本文の検査が元の PR の上で走り、Ruleset の strict も残せる）。
#   その場方式の条件: max_parallel_checks が 1、batch_size が 1、merge_conditions を書かない（queue_conditions と同じ扱い）。
# - マージを人が判断する決まりは変えない（`merge:requested` のラベルを付けるのは人だけ）。
#   ただし PoC では AI も同じアカウントで動くため、AI がラベルを付けることは手順書でしか止められない。
#   配る標準では、AI を専用の ID で動かし、人の承認をキューに入る条件に入れる。
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - label = merge:requested
      - -draft
      - check-success = app-check
      - check-success = pr-body-check

pull_request_rules:
  - name: merge:requested のラベルが付いた PR をキューに入れる
    conditions:
      - label = merge:requested
      - -draft
    actions:
      queue:
        name: default
