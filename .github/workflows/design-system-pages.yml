name: Design system Pages

# デザインシステムの Storybook を GitHub Pages に公開する（https://namu112358.github.io/poc-software-factory-20261112/）。
# main に入ったものだけを公開する。PR では動かさない（PR のコードで公開しない）。
# 前提: リポジトリの Settings → Pages → Source が「GitHub Actions」になっていること。
on:
  push:
    branches: [main]
    paths:
      - "design-system/**"
      - ".github/workflows/design-system-pages.yml"
  workflow_dispatch:

# 書き出し（npm ci・build）は読むだけの権限で動かし、公開の権限は deploy のジョブだけに付ける。
permissions:
  contents: read

# 公開は同時に 1 つだけ。途中の公開は取り消さず、後から来たものを待たせる。
concurrency:
  group: design-system-pages
  cancel-in-progress: false

jobs:
  build:
    name: design-system-pages-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: design-system/storybook-static

  deploy:
    name: design-system-pages-deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
