# レビューの Routine の結果を、PR の最新のコミットの status にする。factory-review は「自動でキューに入ってよい」（risk:high・品質のゲートを変える PR には付かない）、
# factory-reviewed は「最新のコミットがレビューを通った」（risk:high・品質のゲートでも付く。merge:requested で人が入れる PR にも要る。#499）。
# Mergify は、risk:high の付いていない PR を「factory-review が success・app-check・design-system-check・pr-body-check が成功・draft でない」でキューに入れる
# （merge:requested を人が付けなくてよい。risk:high の PR は今までどおり人が merge:requested を付ける）。
# - 判定は scripts/factory/claim.ts の review-status（merge-check と同じ判定）。最新のレビューの印 <!-- factory:review verdict=ok ... commit=<SHA> -->
#   が書き込み権限のある人のもので、SHA が最新のコミット（または、その後が main の取り込みだけのコミット）なら success、
#   最新のコミットへのレビューが ok でなければ failure、それ以外は付けない。
# - このワークフローは、必ず main の定義で動くきっかけ（pull_request_target・workflow_run・schedule）だけで起動する。PR の側でワークフローや
#   判定のスクリプトを書き換えても、status は付けられない。PR のコードは実行しない（main を取り出し、PR は git で差分を読むだけ）。
# - レビューが書かれたときは factory-review-trigger.yml（権限なし）が終わったのをきっかけに動く。
# - キューが main を取り込むと最新のコミットが変わるので、PR に push があったときも判定し直して引き継ぐ。
# - 15 分ごとにも、開いている Ready の PR をすべて判定し直す（起動のイベントが届かなかったとき・#461 より前に作られたブランチで
#   レビューのきっかけのワークフローが無いときも、15 分以内に拾うため）。今の status と同じなら付け直さない。
name: Factory review status

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ["Factory review trigger"]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  status:
    name: factory-review-status
    runs-on: ubuntu-latest
    steps:
      - name: 対象の PR を決める
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_FROM_TARGET: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            # 開いている Ready の PR のうち、このリポジトリのブランチのものだけ
            prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq "[.[] | select(.draft == false and .head.repo.full_name == \"$REPO\") | .number] | join(\" \")")
          else
            # フォークからの PR は対象にしない（このリポジトリのブランチの PR だけ）
            if [ "$HEAD_REPO" != "$REPO" ]; then echo "フォークの PR は対象にしない"; exit 0; fi
            prs="$PR_FROM_TARGET"
            if [ -z "$prs" ]; then
              prs=$(gh api "repos/$REPO/commits/$RUN_HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
            fi
          fi
          echo "対象: ${prs:-なし}"
          echo "numbers=$prs" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr.outputs.numbers != ''
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.numbers != ''
        with:
          node-version: "22"
      - name: レビューの結果を status にする
        if: steps.pr.outputs.numbers != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.pr.outputs.numbers }}
          REPO: ${{ github.repository }}
        run: |
          # 1 つの status を、今の値と違うときだけ付ける（失敗しても次へ進む）
          post() {
            local pr="$1" sha="$2" context="$3" state="$4" desc="$5"
            if [ -z "$state" ]; then echo "PR $pr: $context は付けない"; return 0; fi
            local current
            current=$(gh api "repos/$REPO/commits/$sha/statuses" --jq "[.[] | select(.context == \"$context\")][0].state // \"\"") || { echo "PR $pr: $context の今の値を読めなかった（付けずに次へ）"; return 0; }
            if [ "$current" = "$state" ]; then echo "PR $pr: $context は $state のまま"; return 0; fi
            gh api -X POST "repos/$REPO/statuses/$sha" -f state="$state" -f context="$context" -f description="$desc" >/dev/null || { echo "PR $pr: $context を付けられなかった（次の回にやり直す）"; return 0; }
            echo "PR $pr: $context=$state を $sha に付けた"
          }
          field() { node -e 'const r=JSON.parse(process.argv[1]); const v=process.argv[2].split(".").reduce((o,k)=>o?.[k],r); process.stdout.write(String(v ?? "").slice(0, 140))' "$1" "$2"; }
          for PR in $PRS; do
            out=$(node scripts/factory/claim.ts review-status "$PR") || { echo "PR $PR: 判定に失敗した（付けずに次へ）"; echo "$out"; continue; }
            echo "$out"
            sha=$(field "$out" sha)
            # factory-review: 自動でキューに入ってよいか（risk:high・品質のゲートを変える PR には付かない）
            post "$PR" "$sha" factory-review "$(field "$out" state)" "$(field "$out" description)"
            # factory-reviewed: 最新のコミットがレビューを通ったか（merge:requested で人が入れる PR にも要る。#499）
            post "$PR" "$sha" factory-reviewed "$(field "$out" reviewed.state)" "$(field "$out" reviewed.description)"
          done
